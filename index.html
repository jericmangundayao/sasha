<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Anniversary</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2f2b;--ink:#f6f1e7;--soft:#e9b9ae;--line:rgba(246,241,231,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0a2321}}
:root[data-theme="dark"]{--bg:#0a2321}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.5rem 1.25rem 2rem;text-align:center}
.frame{position:relative;padding:10px;border:1px solid var(--line);border-radius:999px 999px 14px 14px;width:min(86vw,420px)}
.frame.wide{border-radius:14px}
.stage{display:flex;align-items:center;justify-content:center;height:min(62vh,520px);overflow:hidden;border-radius:999px 999px 8px 8px;background:#0003}
.wide .stage{border-radius:8px}
.stage img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease}
.wide .stage img{object-fit:contain}
.stage img.out{opacity:0}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1.02;margin:.2rem 0 0;letter-spacing:.01em}
.date{font-size:1.15rem;letter-spacing:.12em;color:var(--soft);margin:0}
.dots{display:flex;gap:.6rem}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--soft);border-color:var(--soft)}
button:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
</style></head><body>
<main>
<div class="frame" id="frame"><div class="stage"><img id="photo" alt="Us together"></div></div>
<div class="dots" id="dots" role="group" aria-label="Choose photo"></div>
<div><h1>Happy Anniversary</h1><p class="date">11/09/24</p></div>
</main>

const img=document.getElementById('photo'),frame=document.getElementById('frame'),dots=document.getElementById('dots');
let i=0,timer;
photos.forEach((_,n)=>{const b=document.createElement('button');b.setAttribute('aria-label','Photo '+(n+1));b.onclick=()=>{show(n);restart()};dots.appendChild(b)});
function show(n,first){
  const apply=()=>{i=n;img.src=photos[n];
    [...dots.children].forEach((d,k)=>d.setAttribute('aria-current',k===n));
    const t=new Image();t.onload=()=>frame.classList.toggle('wide',t.width>t.height);t.src=photos[n];
    img.classList.remove('out')};
  if(first){apply();return}
  img.classList.add('out');setTimeout(apply,600);
}
function restart(){clearInterval(timer);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>show((i+1)%photos.length),4500)}
show(0,true);restart();
</script></body></html>
